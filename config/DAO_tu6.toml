# XenonRecomp config for Dragon Age: Origins with Title Update 6 (version 0x601):
# the disc's default.xex with title_update/default.xexp applied. Needed by Awakening and
# the DLC campaigns after it. The generated code goes to ppc_tu6/ with its names
# prefixed (scripts/recomp.cmd tu6), so both builds link into one executable.
[main]
file_path = "../game/default.xex"
patch_file_path = "../title_update/default.xexp"
out_directory_path = "../ppc_tu6"
switch_table_file_path = "DAO_tu6_switch_tables.toml"

# As DAO.toml.
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

