# Builds DAORecomp.exe, what players download (the launcher with the installer in it).
# Run it from the Actions tab (the exe is an artifact of the run), or push a version tag
# (vX.Y.Z, as the launcher's update check reads them) to publish it on a release.
name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # DAORecomp.exe: the launcher with its Install view, carrying the installer
      # (built first). Building it accepts the Microsoft build tools license for
      # their download, as install.py --accept-msvc-license does.
      - name: Build DAORecomp.exe
        run: python scripts/build_setup_exe.py
      # Launchers before v0.6 update with the asset named DAORecomp-Installer.exe:
      # the same exe under that name.
      - name: Name it for older launchers
        shell: bash
        run: cp dist/DAORecomp.exe dist/DAORecomp-Installer.exe
      - uses: actions/upload-artifact@v5
        with:
          name: DAORecomp
          path: dist/DAORecomp.exe
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        # v0.x tags are marked as pre-releases.
        run: |
          flags=""
          [[ "${{ github.ref_name }}" == v0.* ]] && flags="--prerelease"
          gh release create "${{ github.ref_name }}" dist/DAORecomp.exe dist/DAORecomp-Installer.exe --generate-notes $flags
