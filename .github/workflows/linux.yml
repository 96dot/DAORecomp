# Checks the Linux side of the installer without game files: fetches the pinned
# sources, sets up clang-cl + the xwin sysroot, builds the recompiler natively,
# and checks #include case. (Running it accepts the Microsoft build tools license
# for the download, as install.py --accept-msvc-license does.)
name: Linux installer check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 llvm-18 python3-venv
      - name: Sources, toolchain, recompiler
        run: python3 install.py --prepare-only --accept-msvc-license
      - name: Include case
        run: python3 scripts/check_include_case.py
      - name: Graphics tab script compiled
        run: python3 scripts/as2c.py DAORecomp/ui/graphics_tab.as DAORecomp/ui/graphics_tab_as.h kGraphicsTabScript --check
      - name: Constants shared by the installer and the program
        run: python3 -I scripts/check_constants.py
      - name: Package reader (Python)
        run: python3 -I scripts/test_stfs.py
